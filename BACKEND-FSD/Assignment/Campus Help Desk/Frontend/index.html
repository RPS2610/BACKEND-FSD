<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Help Desk</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Campus Help Desk</h1>

        <p class="subtitle">
            Submit your campus-related problem or request
        </p>

        <!-- Request Form -->
        <form id="requestForm">

            <div class="form-group">
                <label for="studentName">Student Name</label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter your name"
                    required
                >
            </div>


            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>


            <div class="form-group">
                <label for="category">Category</label>

                <select id="category" required>

                    <option value="">Select Category</option>

                    <option value="Wi-Fi">
                        Wi-Fi
                    </option>

                    <option value="Electricity">
                        Electricity
                    </option>

                    <option value="Classroom">
                        Classroom
                    </option>

                    <option value="Library">
                        Library
                    </option>

                    <option value="Hostel">
                        Hostel
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>
            </div>


            <div class="form-group">
                <label for="description">
                    Problem Description
                </label>

                <textarea
                    id="description"
                    placeholder="Describe your problem..."
                    required
                ></textarea>
            </div>


            <div class="form-group">
                <label for="priority">Priority</label>

                <select id="priority" required>

                    <option value="">
                        Select Priority
                    </option>

                    <option value="Low">
                        Low
                    </option>

                    <option value="Medium">
                        Medium
                    </option>

                    <option value="High">
                        High
                    </option>

                </select>
            </div>


            <button type="submit">
                Submit Request
            </button>

        </form>


        <!-- Submitted Requests -->

        <h2>Submitted Requests</h2>

        <div id="requestsList">

            <!-- Requests will appear here -->

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
